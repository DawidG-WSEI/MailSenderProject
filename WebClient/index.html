<!doctype html>
<!-- Strona wygenerowana przy pomocy GPT 5.2 Codex Xhigh -> Przeanalizuj repozytorium, stwórz sobie dokumentację i na jej podstawie utwórz interfejs użytkownika (powinien to być czysty html, żadnych vite'ów i innych bundlerów - mówimy temu stanowcze nie. Do komunikacji z backendem (c# .net) użyj js z folderu dist (przetranspilowany typescript na js z folderu src - openapi) -->
<!-- Style dostosowane lekko przeze mnie by nie było overflowów i innych dziadostw -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MailSender WebClient</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --bg: #0f172a;
        --bg-accent: #1e293b;
        --card: #111827;
        --card-border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --accent-2: #38bdf8;
        --error: #f87171;
        --success: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% 20%, #1e1b4b 0%, transparent 60%),
          radial-gradient(900px 500px at 80% 0%, #0f766e 0%, transparent 55%),
          linear-gradient(120deg, var(--bg), var(--bg-accent));
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }

      main {
        width: min(960px, 100%);
        display: grid;
        gap: 24px;
        animation: rise 0.6s ease-out;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(32px, 4vw, 44px);
        margin: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        max-width: 60ch;
      }

      .card {
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
        display: grid;
        gap: 18px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #475569;
        background: #0f172a;
        color: var(--text);
        font-size: 15px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .row {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      button {
        padding: 12px 18px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0f172a;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(34, 211, 238, 0.35);
      }

      .result {
        margin: 0;
        padding: 16px;
        border-radius: 12px;
        background: #0b1120;
        border: 1px solid #334155;
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 900px;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .result.success {
        border-color: color-mix(in srgb, var(--success) 60%, #334155);
        color: var(--success);
      }

      .result.error {
        border-color: color-mix(in srgb, var(--error) 60%, #334155);
        color: var(--error);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MailSender WebClient</h1>
        <p>
          Prosty panel do wysylania wiadomosci przez API. Domyslny adres API:
          <strong>http://localhost:5234</strong>.
        </p>
      </header>

      <section class="card">
        <h2>Rejestracja aplikacji (JWT)</h2>
        <p class="hint">
          Wpisz dane aplikacji i haslo rejestracyjne. Wygenerowany token zostanie
          wpisany w pole Token JWT ponizej.
        </p>
        <form id="register-form">
          <div class="row">
            <label>
              AppId
              <input id="app-id" name="app-id" type="text" placeholder="my application id" required />
            </label>
            <label>
              AppName
              <input id="app-name" name="app-name" type="text" placeholder="my application name" required />
            </label>
          </div>
          <label>
            Haslo rejestracyjne
            <input id="app-pass" name="app-pass" type="password" placeholder="q##wa123" required />
          </label>
          <button type="submit">Generuj token</button>
        </form>
      </section>

      <section class="card">
        <h2>Wysylka wiadomosci</h2>
        <form id="mail-form">
          <div class="row">
            <label>
              Odbiorca (email)
              <input id="odbiorca" name="odbiorca" type="email" placeholder="user@example.com" required />
            </label>
            <label>
              Temat
              <input id="temat" name="temat" type="text" placeholder="Temat wiadomosci" required />
            </label>
          </div>
          <label>
            Tekst
            <textarea id="tekst" name="tekst" placeholder="Wpisz wiadomosc" required></textarea>
          </label>
          <label>
            Token JWT
            <textarea id="token" name="token" placeholder="Bearer token" required></textarea>
          </label>
          <button type="submit">Wyslij wiadomosc</button>
        </form>
      </section>

      <section class="card">
        <h2>Wynik</h2>
        <pre id="result" class="result">Brak akcji.</pre>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "openapi-fetch": "https://esm.sh/openapi-fetch@0.12.2"
        }
      }
    </script>
    <script type="module" src="./dist/web.js"></script>
  </body>
</html>
